name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every test without reusing evidence
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verification-plan:
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      solver_reuse: ${{ steps.scope.outputs.solver_reuse }}
      calibration_reuse: ${{ steps.scope.outputs.calibration_reuse }}
      solver_fingerprint: ${{ steps.scope.outputs.solver_fingerprint }}
      calibration_fingerprint: ${{ steps.scope.outputs.calibration_fingerprint }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Look for successful verification of these exact source files
        id: evidence
        run: python3 scripts/ci_reuse.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check successful verification of expensive test inputs
        id: scope
        run: python3 scripts/ci_test_scope.py
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || false }}
  warm-caches:
    # PR caches are scoped to their merge ref. Seed the default-branch caches
    # so future PRs can restore them, even when main reuses verification.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/verification-dependencies
        timeout-minutes: 10
        with:
          python: '3.13'
          cache-only: 'true'

  verify:
    needs: verification-plan
    if: needs.verification-plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/verification-dependencies
        timeout-minutes: 10
        with:
          python: '3.13'
      - run: python scripts/ci_test_scope.py run
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          SOLVER_REUSE: ${{ needs.verification-plan.outputs.solver_reuse }}
          CALIBRATION_REUSE: ${{ needs.verification-plan.outputs.calibration_reuse }}
      - name: Verify root-owned install permissions as an unprivileged account
        run: sudo /usr/bin/python3 scripts/check_install_permissions.py
      - name: Verify update helper permissions and real Unix peer identities
        run: sudo /usr/bin/python3 scripts/check_update_permissions.py
      - name: Verify service-user checks under the actual helper hardening
        run: sudo /usr/bin/python3 scripts/check_update_systemd.py
      - run: node --check src/magi/web/app.js && node --check src/magi/web/tracks.js && node --check src/magi/web/events.js
      - run: node tests/test_tracks.js
      - name: Exercise dashboard against a synthetic station
        run: python tests/run_dashboard.py
        env:
          PYTHONPATH: src
          NODE_PATH: /tmp/magi-browser/node_modules
          MAGI_BROWSER_TEST: '1'
      - name: Upload rendered dashboard snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-dashboard-snapshots
          path: dist/browser
          if-no-files-found: ignore
      - run: bash -n scripts/install.sh scripts/install-updater.sh scripts/uninstall.sh
      - run: python scripts/build_release.py dist/magi-prototype.zip
  verification-proof:
    needs: [verify, verification-plan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the exact verified source tree
        id: source
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tree" > verified-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ steps.source.outputs.tree }}
          path: verified-source.txt
          retention-days: 30
      - name: Record fresh solver verification
        if: needs.verification-plan.outputs.solver_reuse != 'true' && needs.verification-plan.outputs.solver_fingerprint != ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-solver-${{ needs.verification-plan.outputs.solver_fingerprint }}
          path: verified-source.txt
          retention-days: 30
      - name: Record fresh calibration integration verification
        if: needs.verification-plan.outputs.calibration_reuse != 'true' && needs.verification-plan.outputs.calibration_fingerprint != ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-calibration-${{ needs.verification-plan.outputs.calibration_fingerprint }}
          path: verified-source.txt
          retention-days: 30
  preview-release:
    if: >-
      always() && github.event_name == 'push' &&
      needs.verification-plan.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.verification-plan.outputs.reuse == 'true'))
    needs: [verification-plan, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build selected version
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"src"); from magi import __version__; ref=os.environ["GITHUB_REF_NAME"]; assert ref == "main" or ref == "v" + __version__'
          python3 scripts/build_release.py dist/magi-prototype.zip
      - name: Publish a preview for a new version
        run: |
          tag="$(PYTHONPATH=src python3 -c 'from magi import __version__; print("v" + __version__)')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its tag and assets unchanged. Bump the version for another release."
          else
            gh release create "$tag" dist/magi-prototype.zip dist/magi-prototype.zip.sha256 --target "$GITHUB_SHA" --prerelease --generate-notes
          fi
        env:
          GH_TOKEN: '${{ github.token }}'
